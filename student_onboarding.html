<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Student Setup | AMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root{--primary:#0b3d91;--secondary:#1f6bff;--light:#f4f7fc;--white:#fff;--text:#1e293b;--gray:#64748b;--border:#dbe4f0;--danger:#b42318}
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;background:var(--light);font-family:'Inter',sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}
        .setup-shell{width:min(100%,760px);background:var(--white);border:1px solid var(--border);border-radius:12px;box-shadow:0 15px 40px rgba(11,61,145,.09);overflow:hidden}
        .setup-header{background:var(--white);color:var(--text);padding:25px 30px;display:flex;align-items:center;gap:15px;border-bottom:1px solid var(--border)}
        .setup-header img{width:48px;height:48px;object-fit:contain}
        .setup-header h1{font-size:22px;color:var(--primary);margin:0 0 5px;font-weight:800}.setup-header p{margin:0;color:var(--gray);font-size:13px}
        .setup-content{padding:28px 30px 30px}.setup-content>p{color:var(--gray);margin:0 0 22px;line-height:1.6}
        .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
        .form-grid[hidden]{display:none!important}
        .password-reset-mode #enrollmentFields{display:none!important}
        .field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}
        label{font-weight:600;font-size:14px;color:var(--primary)}
        input,select{width:100%;min-height:46px;padding:11px 13px;border:1px solid var(--border);border-radius:8px;background:white;color:var(--text);font:inherit}
        input:focus,select:focus{outline:3px solid rgba(31,107,255,.15);border-color:var(--secondary)}
        .password-input-wrap{position:relative}.password-input-wrap input{padding-right:48px}.password-input-wrap .password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:transparent;color:var(--gray);cursor:pointer;display:grid;place-items:center}.password-input-wrap .password-toggle i{pointer-events:none}
        .password-note{font-size:12px;color:var(--gray);line-height:1.4}
        .submit-button{margin-top:22px;width:100%;min-height:48px;border:0;border-radius:8px;background:var(--primary);color:white;font-weight:700;font-size:15px;cursor:pointer}
        .submit-button:hover{background:#082d6b}
        .submit-button:disabled{opacity:.65;cursor:wait}
        .form-error{min-height:20px;margin-top:12px;color:var(--danger);font-size:14px}
        @media(max-width:560px){body{padding:12px}.setup-header{padding:20px}.setup-content{padding:22px 20px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
    </style>
    <script>
        if (new URLSearchParams(window.location.search).get('mode') === 'password') {
            document.documentElement.classList.add('password-reset-mode');
        }
    </script>
</head>
<body>
    <main class="setup-shell">
        <header class="setup-header">
            <img src="school_logo.png" alt="Talisay City College logo">
            <div><h1>Complete Your Student Account</h1><p>Academic Monitoring System · Talisay City College</p></div>
        </header>
        <section class="setup-content">
            <p>Add your name, gender, enrollment, contact email, and new password to finish setting up your account.</p>
            <form id="setupForm">
                <div class="form-grid" id="enrollmentFields">
                    <div class="field"><label for="studentFirstName">First name</label><input id="studentFirstName" type="text" autocomplete="given-name" required></div>
                    <div class="field"><label for="studentMiddleInitial">Middle initial</label><input id="studentMiddleInitial" type="text" maxlength="10" autocomplete="additional-name"></div>
                    <div class="field"><label for="studentLastName">Last name</label><input id="studentLastName" type="text" autocomplete="family-name" required></div>
                    <div class="field"><label for="studentGender">Gender</label><select id="studentGender" required><option value="">Select Gender</option><option value="Male">Male</option><option value="Female">Female</option></select></div>
                    <div class="field"><label for="studentDepartment">Department</label><select id="studentDepartment" onchange="loadOnboardingMajors()" required><option value="">Select Department</option></select></div>
                    <div class="field"><label for="studentYear">Year level</label><select id="studentYear" onchange="loadOnboardingMajors()" required><option value="">Select Year</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></div>
                    <div class="field"><label for="studentMajor">Major</label><select id="studentMajor" onchange="loadOnboardingSections()" required><option value="">Select Major</option></select></div>
                    <div class="field"><label for="studentSection">Section</label><select id="studentSection" required><option value="">Select Section</option></select></div>
                    <div class="field full"><label for="studentEmail">Email address</label><input id="studentEmail" type="email" autocomplete="email" required></div>
                </div>
                <div class="form-grid" id="passwordFields" style="margin-top:16px;">
                    <div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required><span class="password-note">Use at least 8 characters. You can change it later.</span></div>
                    <div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div>
                </div>
                <button id="saveButton" class="submit-button" type="submit">Save and Continue</button>
                <div id="formError" class="form-error" role="alert"></div>
            </form>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL='https://nrqrsolfowebujogawti.supabase.co';
        const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJucXJzb2xmb3dlYnVqb2dhd3RpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyODE2NjksImV4cCI6MjA5NDg1NzY2OX0.XcawTf9niOIZbG0hBTtwSXjySWfdVl3LAClbWdZmfl8';
        const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
        const FUNCTIONS_URL=`${SUPABASE_URL}/functions/v1/manage-student-accounts`;
        const form=document.getElementById('setupForm');
        const errorBox=document.getElementById('formError');
        const saveButton=document.getElementById('saveButton');
        let currentUser=null;
        let passwordOnlyMode=new URLSearchParams(window.location.search).get('mode')==='password';
        let currentAccessToken='';

        function applyPasswordOnlyMode(){
            passwordOnlyMode=true;
            document.getElementById('studentEmail').required=false;
            document.getElementById('enrollmentFields').hidden=true;
            document.querySelectorAll('#enrollmentFields [required]').forEach(field=>field.required=false);
            document.querySelector('.setup-header h1').textContent='Choose a New Password';
            document.querySelector('.setup-content>p').textContent='Your administrator reset your password. Choose a new password to continue; your student details and section will stay unchanged.';
            document.querySelector('#newPassword + .password-note').textContent='Use at least 8 characters.';
            document.getElementById('saveButton').textContent='Save New Password';
        }

        if(passwordOnlyMode) applyPasswordOnlyMode();

        async function initialize(){
            let { data: { session }, error } = await supabaseClient.auth.getSession();
            let user = session?.user || null;
            if (!user) {
                const handoffValue = sessionStorage.getItem('ams_student_setup_session');
                if (handoffValue) {
                    sessionStorage.removeItem('ams_student_setup_session');
                    try {
                        const handoff = JSON.parse(handoffValue);
                        const restored = await supabaseClient.auth.setSession(handoff);
                        session = restored.data?.session || null;
                        user = session?.user || null;
                        error = restored.error || error;
                    } catch (restoreError) {
                        error = restoreError;
                    }
                }
            }
            if (!user) {
                const refreshed = await supabaseClient.auth.refreshSession();
                session = refreshed.data?.session || null;
                user = session?.user || null;
                error = refreshed.error || error;
            }
            if (!user) {
                errorBox.innerHTML = 'Your sign-in session could not be restored. <a href="login.html">Return to Login</a>, sign in again, and complete setup without closing the browser tab.';
                console.error('Onboarding session could not be restored', error);
                return;
            }
            currentUser=user;
            session=await supabaseClient.auth.getSession().then(result=>result.data.session);
            currentAccessToken=session?.access_token||'';
            if(!currentAccessToken){errorBox.textContent='Your sign-in session expired. Return to Login and try again.';return;}
            const {data:appUser,error:appError}=await supabaseClient.from('users').select('role_id, email, onboarding_required, force_password_change').eq('user_id',user.id).maybeSingle();
            if(appError||!appUser||Number(appUser.role_id)!==3){errorBox.textContent='This setup page is only for student accounts.';return;}
            const internalStudentLogin=Boolean(appUser.email?.endsWith('@accounts.tcc.invalid'));
            const requestedMode=new URLSearchParams(window.location.search).get('mode');
            const requestedPasswordMode=requestedMode==='password';
            const requestedSetupMode=requestedMode==='setup';
            const passwordChangeRequired=Boolean(appUser.force_password_change||user.user_metadata?.force_password_change);
            const onboardingRequired=!requestedPasswordMode&&Boolean(requestedSetupMode||appUser.onboarding_required||user.user_metadata?.onboarding_required||(!passwordChangeRequired&&internalStudentLogin));
            passwordOnlyMode=requestedPasswordMode||(passwordChangeRequired&&!onboardingRequired);
            if(passwordOnlyMode){
                applyPasswordOnlyMode();
                return;
            }
            if(!onboardingRequired){
                errorBox.textContent='This account is not marked for first-time setup. Sign in normally or contact the administrator if this is a newly created student account.';
                return;
            }
            document.querySelector('.setup-header h1').textContent='Complete Your Student Profile';
            document.querySelector('.setup-content>p').textContent='Enter your name, gender, enrollment, contact email, and new password to finish setting up your account.';
            await loadOnboardingDepartments();
        }

        async function loadOnboardingDepartments(){
            if(passwordOnlyMode) return;
            const departmentSelect=document.getElementById('studentDepartment');
            departmentSelect.innerHTML='<option value="">Select Department</option>';
            const response=await fetch(FUNCTIONS_URL,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${currentAccessToken}`},body:JSON.stringify({action:'load-setup-options',scope:'departments'})});
            const result=await response.json();
            if(!response.ok) throw new Error(result.error||'Unable to load departments.');
            (result.data||[]).forEach(department=>departmentSelect.add(new Option(department.department_name,department.department_id)));
        }

        async function loadOnboardingMajors(){
            const departmentId=document.getElementById('studentDepartment').value;
            const yearLevel=document.getElementById('studentYear').value;
            const majorSelect=document.getElementById('studentMajor');
            const sectionSelect=document.getElementById('studentSection');
            majorSelect.innerHTML='<option value="">Select Major</option>';
            sectionSelect.innerHTML='<option value="">Select Section</option>';
            if(!departmentId||!yearLevel) return;
            const response=await fetch(FUNCTIONS_URL,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${currentAccessToken}`},body:JSON.stringify({action:'load-setup-options',scope:'majors',department_id:Number(departmentId),year_level:yearLevel})});
            const result=await response.json();
            if(!response.ok) throw new Error(result.error||'Unable to load majors.');
            (result.data||[]).forEach(major=>majorSelect.add(new Option(major.major_name,major.major_id)));
        }

        async function loadOnboardingSections(){
            const majorId=document.getElementById('studentMajor').value;
            const yearLevel=document.getElementById('studentYear').value;
            const sectionSelect=document.getElementById('studentSection');
            sectionSelect.innerHTML='<option value="">Select Section</option>';
            if(!majorId||!yearLevel) return;
            const response=await fetch(FUNCTIONS_URL,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${currentAccessToken}`},body:JSON.stringify({action:'load-setup-options',scope:'sections',major_id:Number(majorId),year_level:yearLevel})});
            const result=await response.json();
            if(!response.ok) throw new Error(result.error||'Unable to load sections.');
            (result.data||[]).forEach(section=>sectionSelect.add(new Option(section.section_name,section.section_id)));
        }

        function setupPasswordToggle(input){
            if(!input||input.dataset.eyeAdded==='true') return;
            input.dataset.eyeAdded='true';
            const wrap=document.createElement('div');
            wrap.className='password-input-wrap';
            input.parentNode.insertBefore(wrap,input);
            wrap.appendChild(input);
            const button=document.createElement('button');
            button.type='button';
            button.className='password-toggle';
            button.setAttribute('aria-label','Show password');
            button.innerHTML='<i class="fa-solid fa-eye"></i>';
            button.addEventListener('click',()=>{
                const show=input.type==='password';
                input.type=show?'text':'password';
                button.setAttribute('aria-label',show?'Hide password':'Show password');
                button.innerHTML=show?' <i class="fa-solid fa-eye-slash"></i>':'<i class="fa-solid fa-eye"></i>';
            });
            wrap.appendChild(button);
        }

        document.querySelectorAll('#passwordFields input[type="password"],#forgotPasswordFields input[type="password"]').forEach(setupPasswordToggle);

        function showError(error){errorBox.textContent=error?.message||'Unable to load the form. Please retry.';}

        form.addEventListener('submit',async event=>{
            event.preventDefault();
            errorBox.textContent='';
            const password=document.getElementById('newPassword').value;
            if(password!==document.getElementById('confirmPassword').value){errorBox.textContent='The passwords do not match.';return;}
            saveButton.disabled=true;
            saveButton.textContent='Saving...';
            try{
                const {data:{session},error:sessionError}=await supabaseClient.auth.getSession();
                if(sessionError) throw sessionError;
                if(!session) throw new Error('Your sign-in session expired. Return to Login, sign in again, and retry setup.');
                if(passwordOnlyMode){
                    const response=await fetch(FUNCTIONS_URL,{
                        method:'POST',
                        headers:{'Content-Type':'application/json',apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${session.access_token}`},
                        body:JSON.stringify({action:'complete-password-change',password})
                    });
                    const result=await response.json();
                    if(!response.ok) throw new Error(result.error||'Unable to update password.');
                    await supabaseClient.auth.signOut();
                    form.innerHTML=`
                        <div style="padding:24px 16px;text-align:center;">
                            <div style="font-size:42px;color:#1f6bff;margin-bottom:12px;"><i class="fa-solid fa-circle-check"></i></div>
                            <h2 style="color:#0b3d91;margin-bottom:10px;">Your password has been saved</h2>
                            <p style="color:#64748b;line-height:1.6;">Return to the login page and sign in again using your Student ID and new password.</p>
                            <a href="login.html" class="submit-button" style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:22px;">Return to Login</a>
                        </div>
                    `;
                    setTimeout(()=>window.location.replace('login.html'),5000);
                    return;
                }
                const response=await fetch(FUNCTIONS_URL,{
                    method:'POST',
                    headers:{'Content-Type':'application/json',apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${session.access_token}`},
                    body:JSON.stringify({
                        action:'complete-onboarding',
                        first_name:document.getElementById('studentFirstName').value.trim(),
                        middle_initial:document.getElementById('studentMiddleInitial').value.trim(),
                        last_name:document.getElementById('studentLastName').value.trim(),
                        gender:document.getElementById('studentGender').value,
                        department_id:Number(document.getElementById('studentDepartment').value),
                        major_id:Number(document.getElementById('studentMajor').value),
                        year_level:document.getElementById('studentYear').value,
                        section_id:Number(document.getElementById('studentSection').value),
                        email:document.getElementById('studentEmail').value.trim(),
                        password
                    })
                });
                const result=await response.json();
                if(!response.ok) throw new Error(result.error||'Unable to complete setup.');
                await supabaseClient.auth.signOut();
                form.innerHTML=`
                    <div style="padding:24px 16px;text-align:center;">
                        <div style="font-size:42px;color:#1f6bff;margin-bottom:12px;"><i class="fa-solid fa-circle-check"></i></div>
                        <h2 style="color:#0b3d91;margin-bottom:10px;">Your information has been saved</h2>
                        <p style="color:#64748b;line-height:1.6;">Your email and password are saved. Please return to the login page and sign in with your Student ID and new password.</p>
                        <a href="login.html" class="submit-button" style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:22px;">Return to Homepage</a>
                    </div>
                `;
                setTimeout(()=>window.location.replace('login.html'),5000);
            }catch(error){showError(error);saveButton.disabled=false;saveButton.textContent='Save and Continue';}
        });

        initialize().catch(showError);
    </script>
</body>
</html>
